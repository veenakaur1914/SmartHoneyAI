<IfModule mpm_prefork_module>
    # Keep enough prefork workers warm to absorb the specified 100 RPS step
    # without Apache's gradual child-spawn behavior becoming the bottleneck.
    StartServers            100
    MinSpareServers         100
    MaxSpareServers         175
    MaxRequestWorkers       225
    # Keep workers stable for the duration of a load phase. Recycling a child
    # can close an otherwise reusable keep-alive connection between k6 requests.
    MaxConnectionsPerChild 0
</IfModule>

KeepAlive On
MaxKeepAliveRequests 250
# k6 reuses pooled connections across one-second arrival intervals. Keep the
# server timeout comfortably above that cadence so the client never races a
# server-side idle close.
KeepAliveTimeout 15
