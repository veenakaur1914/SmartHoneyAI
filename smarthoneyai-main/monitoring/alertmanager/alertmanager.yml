global:
  resolve_timeout: 5m

route:
  receiver: operator-log
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: operator-log
      repeat_interval: 30m

receivers:
  - name: operator-log

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname]

