name: honeypot-ai

x-app-common: &app-common
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-backend-environment: &backend-environment
  NODE_ENV: production
  APP_URL: ${APP_URL:?Set APP_URL in .env}
  INTERNAL_SERVICE_URLS: "1"
  POSTGRES_USER: ${POSTGRES_USER:-honeypot}
  POSTGRES_DB: ${POSTGRES_DB:-honeypot_ai}
  HF_MODEL_ID: ${HF_MODEL_ID:-MoritzLaurer/deberta-v3-base-zeroshot-v1}
  HF_MODEL_REVISION: ${HF_MODEL_REVISION:?Pin HF_MODEL_REVISION to an immutable commit}
  HF_CHAT_MODEL: ${HF_CHAT_MODEL:-Qwen/Qwen2.5-7B-Instruct-1M:cheapest}
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: "${SMTP_USER:-}"
  SMTP_FROM: "${SMTP_FROM:-}"
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?Set PLATFORM_ADMIN_EMAIL}
  PLATFORM_ORGANIZATION_NAME: ${PLATFORM_ORGANIZATION_NAME:?Set PLATFORM_ORGANIZATION_NAME}
  PLATFORM_ORGANIZATION_SLUG: ${PLATFORM_ORGANIZATION_SLUG:?Set PLATFORM_ORGANIZATION_SLUG}

services:
  web:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_FILTER: "@honeypot/web"
        APP_COMMAND: start
        NEXT_PUBLIC_API_URL: /v1
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: /v1
      APP_FILTER: "@honeypot/web"
      APP_COMMAND: start
    networks:
      - app
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    cpus: 1.0

  api:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_FILTER: "@honeypot/api"
        APP_COMMAND: start
    environment:
      <<: *backend-environment
      APP_FILTER: "@honeypot/api"
      APP_COMMAND: start
      PORT: "4000"
      HOSTNAME: 0.0.0.0
    secrets:
      - postgres_password
      - redis_password
      - session_secret
      - agent_signing_secret
      - policy_signing_private_key
      - policy_signing_public_key
      - hf_token
      - telegram_bot_token
      - smtp_password
    networks:
      - app
      - data
      - egress
    expose:
      - "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 768m
    cpus: 1.5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
      args:
        APP_FILTER: "@honeypot/database"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      INTERNAL_SERVICE_URLS: "1"
      POSTGRES_USER: ${POSTGRES_USER:-honeypot}
      POSTGRES_DB: ${POSTGRES_DB:-honeypot_ai}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?Set PLATFORM_ADMIN_EMAIL}
      PLATFORM_ORGANIZATION_NAME: ${PLATFORM_ORGANIZATION_NAME:?Set PLATFORM_ORGANIZATION_NAME}
      PLATFORM_ORGANIZATION_SLUG: ${PLATFORM_ORGANIZATION_SLUG:?Set PLATFORM_ORGANIZATION_SLUG}
    secrets:
      - postgres_password
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

  worker:
    <<: *app-common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_FILTER: "@honeypot/worker"
        APP_COMMAND: start
    environment:
      <<: *backend-environment
      APP_FILTER: "@honeypot/worker"
      APP_COMMAND: start
    secrets:
      - postgres_password
      - redis_password
      - hf_token
      - telegram_bot_token
    networks:
      - app
      - data
      - egress
    expose:
      - "4001"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4001/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 1024m
    cpus: 2.0

  postgres:
    image: postgres:17.5-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honeypot}
      POSTGRES_DB: ${POSTGRES_DB:-honeypot_ai}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 2.0

  redis:
    image: redis:8.0.2-alpine3.21
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0

  nginx:
    image: nginx:1.28.0-alpine3.21
    restart: unless-stopped
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/run:size=1m
      - /tmp:size=48m,mode=1777
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-./secrets/tls}:/etc/nginx/tls:ro
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    networks:
      - edge
      - app
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:v3.4.1
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app
      - monitoring
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25

  grafana:
    image: grafana/grafana:12.0.2
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.5

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
  egress:
  monitoring:
    internal: true

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  session_secret:
    file: ./secrets/session_secret
  agent_signing_secret:
    file: ./secrets/agent_signing_secret
  policy_signing_private_key:
    file: ./secrets/policy_signing_private_key
  policy_signing_public_key:
    file: ./secrets/policy_signing_public_key
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  hf_token:
    file: ./secrets/hf_token
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  smtp_password:
    file: ./secrets/smtp_password
