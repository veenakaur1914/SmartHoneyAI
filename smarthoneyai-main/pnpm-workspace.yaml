packages:
  - apps/*
  - packages/*
overrides:
  effect: 3.20.0
  postcss: 8.5.19
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - bullmq@5.80.2
