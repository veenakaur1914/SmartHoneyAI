name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm guard:production-fixtures
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  wordpress-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4.12
        env:
          MARIADB_ROOT_PASSWORD: wordpress-tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, sodium
          coverage: none
      - name: Install WordPress test fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes subversion default-mysql-client
          bash scripts/install-wordpress-tests.sh wordpress_test root wordpress-tests 127.0.0.1:3306 7.0.0
      - name: Validate and test plugin
        shell: bash
        run: |
          find plugins/wordpress -type f -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -r -n1 php -l
          cd plugins/wordpress
          composer install --no-interaction --prefer-dist
          WP_TESTS_DIR=/tmp/wordpress-tests-lib composer test
          composer lint
      - name: Build reproducible plugin package
        run: |
          scripts/package-wordpress-plugin.sh /tmp/honeypot-ai-first.zip
          scripts/package-wordpress-plugin.sh /tmp/honeypot-ai-1.0.0.zip
          test "$(sha256sum /tmp/honeypot-ai-first.zip | cut -d' ' -f1)" = "$(sha256sum /tmp/honeypot-ai-1.0.0.zip | cut -d' ' -f1)"
          unzip -l /tmp/honeypot-ai-1.0.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: honeypot-ai-wordpress-1.0.0
          path: /tmp/honeypot-ai-1.0.0.zip
          if-no-files-found: error

  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_URL: https://honeypot.example.com
      PLATFORM_ADMIN_EMAIL: admin@honeypot.example.com
      HF_MODEL_REVISION: 0000000000000000000000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - name: Create validation-only secrets
        run: GENERATE_SELF_SIGNED_TLS=1 DOMAIN=honeypot.example.com sh scripts/init-secrets.sh
      - name: Create isolated WordPress demo secrets
        run: sh scripts/local-demo-init.sh
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -p honeypot-ai-e2e -f docker-compose.yml -f docker-compose.wordpress-demo.yml config --quiet
      - name: Validate Nginx
        run: >-
          docker run --rm
          --add-host web:127.0.0.1
          --add-host api:127.0.0.1
          -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          -v "$PWD/secrets/tls:/etc/nginx/tls:ro"
          nginx:1.28.0-alpine3.21 nginx -t
      - name: Validate Prometheus
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          -v "$PWD/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
          -v "$PWD/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
          prom/prometheus:v3.4.1 check config /etc/prometheus/prometheus.yml
      - name: Validate Alertmanager
        run: >-
          docker run --rm
          --entrypoint /bin/amtool
          -v "$PWD/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
          prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Validate Grafana dashboard JSON
        run: jq empty monitoring/grafana/dashboards/*.json
      - name: Build service images
        run: docker compose build migrate web api worker

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
